name: Check V1.60.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-v1601.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check v160.js
      - name: Check required files
        run: |
          test -s v160.js
          test -s v160.css
