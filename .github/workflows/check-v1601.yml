name: Check V1.60.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-v1601.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier JavaScript et fichiers V1.60.1
        shell: bash
        run: |
          set -euo pipefail
          node --check v160.js
          grep -q 'g10OpenReceiptV160' v160.js
          grep -q 'v160-num' v160.js
          grep -q 'v160-receipt-modal' v160.css
          grep -q 'v160.js' index.html
          grep -q 'v160.css' index.html
