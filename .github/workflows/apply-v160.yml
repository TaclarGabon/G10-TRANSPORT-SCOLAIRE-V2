name: Apply V1.60

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-v160.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify V1.59.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "e2f4b5af3039d86c3827a239c389f14c330d0aae"

      - name: Apply V1.60 loader
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          new_title = "<title>G10 Transport Scolaire V2 — V1.60 — Akanda & Inter-Akanda</title>"
          loader = '\n<link rel="stylesheet" href="v160.css">\n<script src="v160.js"></script>\n'
          end_tag = "</body></html>"

          if new_title not in text:
              raise SystemExit("Titre V1.60 introuvable.")

          # Le premier passage a chargé les fichiers après </html>.
          # On retire ce chargeur puis on le replace juste avant la dernière fermeture HTML.
          if loader in text:
              text = text.replace(loader, "", 1)

          end_pos = text.rfind(end_tag)
          if end_pos < 0:
              raise SystemExit("Balise de fin HTML introuvable.")

          text = text[:end_pos] + loader + text[end_pos:]
          path.write_text(text, encoding="utf-8")

      - name: Validate V1.60 JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check v160.js
          grep -q 'V1.60 — Akanda & Inter-Akanda' index.html
          grep -q 'href="v160.css"' index.html
          grep -q 'src="v160.js"' index.html

      - name: Commit V1.60
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Aucune modification à committer."
          else
            git commit -m "V1.60: activer Akanda et Inter-Akanda"
            git push
          fi
