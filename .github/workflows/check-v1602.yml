name: Check V1.60.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-v1602.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check v160.js
      - name: Check schedule tab patch
        run: grep -q "Emplois du temps" v160.js
