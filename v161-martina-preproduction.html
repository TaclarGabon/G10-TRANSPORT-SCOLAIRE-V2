<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G10 — préproduction Martina (badges PDF et dépenses)</title>
<style>html,body{height:100%;margin:0;background:#eef4fb}#app{width:100%;height:100%;border:0}#notice{position:fixed;bottom:0;left:0;right:0;background:#fff7d9;color:#593b00;font:12px Arial,sans-serif;padding:5px 12px;z-index:5;text-align:center;pointer-events:none}</style>
</head><body>
<iframe id="app" src="v1471.html" title="G10 V2 — préproduction"></iframe>
<div id="notice">Préproduction isolée — les données V2 sont réelles. Ne pas effectuer de saisie réelle sur cette page avant validation.</div>
<script>
(function(){
  'use strict';
  const outer=document.getElementById('app');
  let injected=false;
  function attempt(){
    try{
      const doc=outer.contentDocument;
      const inner=doc?.getElementById('app');
      if(!inner){setTimeout(attempt,400);return;}
      function inject(){
        if(injected)return;
        const innerDoc=inner.contentDocument;
        if(!innerDoc || !innerDoc.body){setTimeout(attempt,400);return;}
        injected=true;
        const scripts=['g10-badges-pdf-v161.js','g10-expense-guard-v161.js'];
        for(const src of scripts){const tag=innerDoc.createElement('script');tag.src=src;innerDoc.body.appendChild(tag);}
      }
      inner.addEventListener('load',inject,{once:true});
      if(inner.contentDocument?.readyState==='complete')inject();
    }catch(e){document.getElementById('notice').textContent='Préproduction indisponible : '+e.message;}
  }
  outer.addEventListener('load',attempt,{once:true});
})();
</script>
</body></html>
